name: paperless-portfolio

x-logging: &logging
  driver: json-file
  options:
    max-size: 5m
    max-file: '2'

services:
  db:
    image: docker.io/library/postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets: [db-password]
    # PostgreSQL 18 changed its image volume layout.
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paperless -d paperless']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  broker:
    image: docker.io/valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: [valkey-server, --appendonly, 'yes', --maxmemory, 64mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    security_opt: [no-new-privileges:true]
    volumes: [brokerdata:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 1.0
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}
      broker: {condition: service_healthy}
    ports: ['127.0.0.1:${PAPERLESS_PORT:-8000}:8000']
    environment:
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS_FILE: /run/secrets/db-password
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/secret-key
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_URL: http://localhost:${PAPERLESS_PORT:-8000}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_MODE: auto
      PAPERLESS_OCR_CLEAN: none
      PAPERLESS_TASK_WORKERS: '1'
      PAPERLESS_THREADS_PER_WORKER: '1'
      PAPERLESS_WEBSERVER_WORKERS: '1'
      PAPERLESS_CONSUMER_POLLING_INTERVAL: '10'
      USERMAP_UID: '${PAPERLESS_UID:-1000}'
      USERMAP_GID: '${PAPERLESS_GID:-1000}'
    secrets: [db-password, secret-key]
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./runtime/consume:/usr/src/paperless/consume
      - ./runtime/export:/usr/src/paperless/export
    healthcheck:
      test: [CMD, curl, -fsSL, --max-time, '5', 'http://localhost:8000/accounts/login/']
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 20
    logging: *logging

secrets:
  db-password: {file: ./.secrets/db-password}
  secret-key: {file: ./.secrets/secret-key}
volumes:
  pgdata:
  brokerdata:
  data:
  media:
