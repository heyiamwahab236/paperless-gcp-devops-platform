# Local defaults. No ingress, LoadBalancer, or autoscaling.
existingSecret: paperless-secrets
url: http://localhost:8000
timeZone: Europe/Berlin
storageClass: ''
storage:
  app: 3Gi
  postgres: 2Gi
  broker: 256Mi
images:
  app: ghcr.io/paperless-ngx/paperless-ngx:3.3.4@sha256:9bc6e8248891bcfa6f52fffe8b81e4ea8cae75790c3ec1b9906961a7ba55c969
  postgres: docker.io/library/postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
  broker: docker.io/valkey/valkey:9-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
resources:
  app:
    requests: {cpu: 200m, memory: 640Mi}
    limits: {cpu: '1', memory: 1536Mi}
  postgres:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
  broker:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 250m, memory: 128Mi}
