name: Image security
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install scanner
        run: python3 scripts/install_ci_tools.py trivy
      - name: Scan locked images and produce SBOMs
        run: python3 scripts/scan_images.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-scans-and-sboms
          path: build/security/
          retention-days: 14
